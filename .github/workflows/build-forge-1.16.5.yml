name: Build Forge 1.16.5

on:
  workflow_dispatch:
  push:
    branches:
      - forge-1.16.5-backport
    paths:
      - 'forge-1.16.5/**'
      - '.github/workflows/build-forge-1.16.5.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Forge 1.16.5 module
        run: ./gradlew -p forge-1.16.5 build