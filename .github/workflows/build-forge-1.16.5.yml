name: Build Forge 1.16.5

on:
  workflow_dispatch:
  push:
    branches:
      - forge-1.16.5-backport
    paths:
      - 'forge-1.16.5/**'
      - '.github/workflows/build-forge-1.16.5.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Set up Gradle 6.8.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 6.8.3

      - name: Build Forge 1.16.5 module
        run: gradle -p forge-1.16.5 build --stacktrace